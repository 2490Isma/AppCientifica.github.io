    }

    function importarDatos() {
        const raw = prompt("Pegue aquí el extracto policial:");
        if (!raw) return;
        const rawSinAcentos = quitarAcentos(raw);
        const limpiar = (t) => t.replace(/\*/g, '').trim();
        const buscarCampo = (keywords) => {
            for (let k of keywords) {
                const regex = new RegExp(k + ":?\\s*(.*)", "i");
                const match = rawSinAcentos.match(regex);
                if (match && match[1] && match[1].trim().length > 1) {
                    // Mismo tramo pero leído del texto ORIGINAL (con acentos), usando la posición del match.
                    const inicio = match.index + match[0].length - match[1].length;
                    return limpiar(raw.substring(inicio).split('\n')[0]);
                }
            }
            return null;
        };
        const car = buscarCampo(["CARATULA", "I.P.P", "HECHO", "CAUSA"]);
        const vic = buscarCampo(["DENUNCIANTE", "VICTIMA", "DAMNIFICADO", "VMA"]);
        const imp = buscarCampo(["CAUSANTE", "IMPUTADO", "APREHENDIDO", "SINDICADO", "CTA"]);
        const lug = buscarCampo(["LUGAR DEL HECHO", "LUGAR", "DOMICILIO"]);
        const fec = buscarCampo(["FECHA DEL HECHO", "FECHA", "FECHA HECHO"]);

        if (car) document.getElementById('caratula').value = car.toUpperCase();
        if (vic) document.getElementById('victima').value = vic;
        if (imp) document.getElementById('imputado').value = imp;

        if (lug) document.getElementById('acta1-lugar').value = lug;
        if (fec) {
            const fechaConvertida = convertirFechaParaInput(fec);
            if (fechaConvertida) document.getElementById('acta1-fecha').value = fechaConvertida;
        }

        const sinMatch = rawSinAcentos.match(/(?:SINTESIS|EXTRACTO|RESEÑA):?\s*([\s\S]*)/i);
        if (sinMatch) {
            const inicioSin = sinMatch.index + sinMatch[0].length - sinMatch[1].length;
            document.getElementById('sintesis').value = raw.substring(inicioSin).trim().replace(/^\*+\s*/, '');
        }
    }

    // ============ AGREGAR DATOS DE EXTRACTOS (reporte ya armado que envía otro compañero) ============
    // A diferencia de "Importar datos", acá el texto pegado ya viene con las mismas etiquetas
    // que arma esta herramienta (CARÁTULA, LEF/ARA, horarios, GPS, etc.), incluso con varias
    // actas numeradas ("1. valor" / "2. valor", a veces con un "*" de viñeta adelante). El lector
    // es tolerante a esas variantes porque cada compañero puede haberlo retipeado a mano.

    const ETIQUETAS_EXTRACTO = [
        'CARATULA', 'FECHA', 'DOC', 'LEF/ARA', 'LEF ADICIONAL',
        'HORA DE SOLICITUD', 'HORA DE SALIDA', 'HORA DE FINALIZACION',
        'VICTIMA', 'IMPUTADO', 'SECCIONAL ACTUANTE', 'UFI INTERVINIENDO',
        'LUGAR DEL HECHO', 'GPS', 'SINTESIS DEL HECHO', 'LABOR PERICIAL Y EVIDENCIAS'
    ];

    function extraerCamposPorEtiqueta(raw, rawSinAcentos) {
        const posiciones = [];
        ETIQUETAS_EXTRACTO.forEach(etq => {
            const escapado = etq.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            const re = new RegExp(`\\*?\\s*${escapado}\\s*:\\*?`, 'i');
            const m = rawSinAcentos.match(re);
            if (m) posiciones.push({ etiqueta: etq, inicio: m.index, finEtiqueta: m.index + m[0].length });
        });
        posiciones.sort((a, b) => a.inicio - b.inicio);
        const campos = {};
        posiciones.forEach((p, i) => {
            const fin = i + 1 < posiciones.length ? posiciones[i + 1].inicio : rawSinAcentos.length;
            campos[p.etiqueta] = raw.substring(p.finEtiqueta, fin).trim();
        });
        return campos;
    }

    // "1. valor" / "* 1. valor" / "* 2 valor" (sin punto) -> array indexado por acta.
    // Si no hay ningún renglón numerado, se toma como valor único (acta 1).
    function dividirValorPorActa(valor) {
        if (!valor) return [];
        const lineas = valor.split('\n').map(l => l.trim()).filter(Boolean);
        const resultado = [];
        let huboNumeradas = false;
        lineas.forEach(l => {
            const m = l.match(/^\*?\s*(\d+)\.?\s+(.*)$/);
            if (m) {
                huboNumeradas = true;
                resultado[parseInt(m[1], 10) - 1] = limpiarValorExtracto(m[2]);
            }
        });
        if (huboNumeradas) return resultado;
        return [limpiarValorExtracto(lineas.join(' '))];
    }

    function limpiarValorExtracto(t) {
        return (t || '').replace(/\*/g, '').replace(/\s*(hs\.?|horas?)\s*$/i, '').trim();
    }

    function agregarDatosExtracto() {
        const raw = prompt("Pegue aquí el reporte/extracto que le envió otro compañero:");
        if (!raw) return;
        const rawSinAcentos = quitarAcentos(raw);
        const campos = extraerCamposPorEtiqueta(raw, rawSinAcentos);

        // Stickers: van sueltos en el primer renglón del mensaje, antes de "C.C.R. CENTRO"
        const primeraLinea = raw.split('\n')[0];
        const emojisSticker = ['🔴', '🟣', '🟢', '🔵', '🟡', '🟤', '⚫'];
        document.querySelectorAll('#gridStickers input').forEach(cb => {
            if (emojisSticker.includes(cb.value) && primeraLinea.includes(cb.value)) cb.checked = true;
        });

        const caratulaVal = limpiarValorExtracto((campos['CARATULA'] || '')).replace(/^["“]|["”]$/g, '').trim();
        const fechas = dividirValorPorActa(campos['FECHA']);
        const lefs = dividirValorPorActa(campos['LEF/ARA']);
        const lefsAdicionales = dividirValorPorActa(campos['LEF ADICIONAL']);
        const hsol = dividirValorPorActa(campos['HORA DE SOLICITUD']);
        const hsal = dividirValorPorActa(campos['HORA DE SALIDA']);
        const hfin = dividirValorPorActa(campos['HORA DE FINALIZACION']);
        const lugares = dividirValorPorActa(campos['LUGAR DEL HECHO']);
        const gpsVals = dividirValorPorActa(campos['GPS']);

        const cantidadActas = Math.max(1, fechas.length, lefs.length, hsol.length, hsal.length, hfin.length, lugares.length, gpsVals.length);

        const valorOVacio = (arr, i) => {
            const v = (arr[i] || '').trim();
            return (v && v !== '---') ? v : '';
        };

        // --- Acta 1 (campos fijos del formulario) ---
        const lef1 = valorOVacio(lefs, 0);
        if (lef1) document.getElementById('acta1-lef').value = lef1;
        const fecha1 = valorOVacio(fechas, 0);
        if (fecha1) {
            const fc = convertirFechaParaInput(fecha1);
            if (fc) document.getElementById('acta1-fecha').value = fc;
        }
        const hsol1 = valorOVacio(hsol, 0); if (hsol1) document.getElementById('acta1-hsol').value = hsol1;
        const hsal1 = valorOVacio(hsal, 0); if (hsal1) document.getElementById('acta1-hsal').value = hsal1;
        const hfin1 = valorOVacio(hfin, 0); if (hfin1) document.getElementById('acta1-hfin').value = hfin1;
        const lugar1 = valorOVacio(lugares, 0); if (lugar1) document.getElementById('acta1-lugar').value = aFormatoTitulo(lugar1);
        const gps1 = valorOVacio(gpsVals, 0); if (gps1) document.getElementById('acta1-gps').value = gps1;
        const lefAd1 = valorOVacio(lefsAdicionales, 0);
        if (lefAd1) lefAd1.split(',').map(s => s.trim()).filter(Boolean).forEach(v => agregarLefExtra(1, v));

        // --- Actas 2 en adelante: se crean si hacen falta ---
        for (let i = 1; i < cantidadActas; i++) {
            const lefAdN = valorOVacio(lefsAdicionales, i);
            agregarBloqueActa({
                lef: valorOVacio(lefs, i),
                fechaRaw: convertirFechaParaInput(valorOVacio(fechas, i) || fecha1) || '',
                h_sol: valorOVacio(hsol, i),
                h_sal: valorOVacio(hsal, i),
                h_fin: valorOVacio(hfin, i),
                lugar: aFormatoTitulo(valorOVacio(lugares, i)),
                gps: valorOVacio(gpsVals, i),
                lefs_extra: lefAdN ? lefAdN.split(',').map(s => s.trim()).filter(Boolean) : []
            });
        }

        if (caratulaVal) document.getElementById('caratula').value = caratulaVal.toUpperCase();
        if (campos['DOC']) document.getElementById('dco').value = limpiarValorExtracto(campos['DOC']);
        if (campos['VICTIMA']) document.getElementById('victima').value = limpiarValorExtracto(campos['VICTIMA']);
        if (campos['IMPUTADO']) {
            const impTexto = limpiarValorExtracto(campos['IMPUTADO']);
            document.getElementById('imputado').value = impTexto;
            const impSel = document.getElementById('imputado_sel');
            const impUpper = impTexto.toUpperCase();
            if (impUpper === 'NEGATIVO' || impUpper === 'SE DESCONOCE') impSel.value = impUpper;
        }

        // Seccional actuante -> Jurisdicción + Dependencia (si coincide con las opciones disponibles)
        if (campos['SECCIONAL ACTUANTE']) {
            const partes = limpiarValorExtracto(campos['SECCIONAL ACTUANTE']).split(/[–-]/).map(s => s.trim());
            const jpcSelect = document.getElementById('jpc');
            const jpcEncontrada = Object.keys(deps).find(j => partes[0] && j.toLowerCase().startsWith(partes[0].toLowerCase().replace(/\.$/, '')));
            if (jpcEncontrada) {
                jpcSelect.value = jpcEncontrada;
                actualizarDep();
                const depEncontrada = partes[1] && deps[jpcEncontrada].find(d => d.toLowerCase() === partes[1].toLowerCase().replace(/\.$/, ''));
                if (depEncontrada) document.getElementById('dep').value = depEncontrada;
            }
        }

        // UFI interviniendo (si coincide con alguna opción del desplegable)
        if (campos['UFI INTERVINIENDO']) {
            const ufiTexto = limpiarValorExtracto(campos['UFI INTERVINIENDO']);
            const selectUfi = document.getElementById('ufi');
            const opcion = Array.from(selectUfi.options).find(o => o.value.toLowerCase().startsWith(ufiTexto.toLowerCase().slice(0, 30)));
            if (opcion) selectUfi.value = opcion.value;
        }

        if (campos['SINTESIS DEL HECHO']) {
            document.getElementById('sintesis').value = limpiarValorExtracto(campos['SINTESIS DEL HECHO']);
        }

        alert("Datos del extracto cargados (" + cantidadActas + (cantidadActas > 1 ? " actas" : " acta") + "). Revisá los campos antes de continuar.");
    }
</script>
