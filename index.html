<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Científica Brandsen - Gestión de Reportes Multi-Acta</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #050a12; padding: 5px; color: #333; margin: 0; }

        /* SPLASH SCREEN */
        #splash-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: #050a12; display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 9999;
            transition: opacity 0.8s ease;
        }
        .splash-img { max-width: 90%; max-height: 65vh; object-fit: contain; border-radius: 12px; box-shadow: 0 4px 25px rgba(0,0,0,0.7); animation: fadeInScale 1.2s ease-out; }
        @keyframes fadeInScale { 0% { opacity: 0; transform: scale(0.9); } 100% { opacity: 1; transform: scale(1); } }
        .loading-bar-container { width: 200px; height: 4px; background: #1a2635; margin-top: 25px; border-radius: 2px; overflow: hidden; }
        .loading-bar-progress { width: 0%; height: 100%; background: #25D366; animation: progress 2.5s linear forwards; }
        @keyframes progress { 0% { width: 0%; } 100% { width: 100%; } }

        /* APP GENERAL */
        #app-content { display: none; }
        .card { background: white; padding: 15px; border-radius: 8px; max-width: 550px; margin: 10px auto; box-shadow: 0 4px 15px rgba(0,0,0,0.6); }
        .color-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 2px; margin-bottom: 8px; border-bottom: 1px solid #eee; padding-bottom: 8px; }
        .color-item { display: flex; flex-direction: column; align-items: center; gap: 1px; min-width: 0; width: 100%; font-size: 0.56rem; background: #f4f6f8; padding: 3px 1px; border-radius: 4px; border: 1px solid #ddd; font-weight: bold; cursor: pointer; text-align: center; }
        .color-item .fila-check-emoji { display: flex; align-items: center; gap: 2px; }
        .color-item input[type="checkbox"] { width: 10px; height: 10px; min-width: 10px; flex: 0 0 auto; padding: 0; margin: 0; }
        .color-item span.texto-sticker { display: block; width: 100%; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .color-item .emoji-sticker { font-size: 1.1rem; line-height: 1; }
        label { display: block; margin-top: 10px; font-weight: bold; font-size: 0.7rem; text-transform: uppercase; color: #555; }
        input, textarea, select { width: 100%; padding: 10px; margin-top: 3px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-size: 0.9rem; }
        input[type="date"] { font-family: inherit; cursor: pointer; }
        .row { display: flex; gap: 4px; }

        /* BLOQUES DE ACTA / INTERVENCIÓN */
        .bloque-acta {
            background: #f8f9fa;
            border: 1px solid #ced4da;
            border-left: 4px solid #007bff;
            padding: 10px;
            margin-top: 10px;
            border-radius: 6px;
            position: relative;
        }
        .header-acta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.75rem;
            font-weight: bold;
            color: #007bff;
            margin-bottom: 5px;
        }
        .btn-remove-acta {
            background: #d9534f;
            color: white;
            border: none;
            padding: 2px 8px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.7rem;
        }
        .btn-add-acta {
            background: #17a2b8;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 0.75rem;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
            text-transform: uppercase;
        }

        /* SECCIÓN DE LABOR PERICIAL (LEFs adicionales + Áreas/evidencias), oculta hasta el modo Ampliación */
        .seccion-labor-acta {
            display: none;
            margin-top: 10px;
            padding: 8px;
            background: #f0f4f8;
            border-left: 3px solid #25D366;
            border-radius: 6px;
        }
        .subtitulo-dossier { font-size: 0.75rem; font-weight: bold; text-transform: uppercase; color: #6f42c1; margin-top: 14px; margin-bottom: 4px; border-bottom: 1px solid #ddd; padding-bottom: 3px; }
        .dyn-row { display: flex; gap: 4px; align-items: flex-start; margin-top: 5px; }
        .dyn-row input, .dyn-row textarea { margin-top: 0; }
        .dyn-row .col-chico { flex: 0 0 70px; }
        .dyn-row .col-grande { flex: 1; }
        .btn-remove-row { background: #d9534f; color: white; border: none; border-radius: 4px; width: 32px; flex: 0 0 32px; font-weight: bold; cursor: pointer; align-self: center; }
        .btn-add-row { background: #6f42c1; color: white; border: none; padding: 8px; border-radius: 4px; width: 100%; margin-top: 8px; font-size: 0.7rem; font-weight: bold; cursor: pointer; }
        .area-block { background: white; border: 1px solid #ddd; border-radius: 6px; padding: 8px; margin-top: 8px; }
        .area-letra-badge { background: #25D366; color: white; font-weight: bold; font-size: 0.75rem; min-width: 24px; height: 24px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex: 0 0 auto; align-self: center; }
        #contenedorDatosPU { margin-top: 8px; }
        .bloque-datos-pu-acta { background: #f3effc; border: 1px solid #d9c8f5; border-radius: 6px; padding: 8px; margin-top: 8px; }
        #contenedorDatosDossier { margin-top: 8px; }
        .bloque-datos-dossier-acta { background: #eaf6ee; border: 1px solid #b9e0c4; border-radius: 6px; padding: 8px; margin-top: 8px; }
        .bloque-datos-dossier-acta textarea { margin-top: 4px; }
        .bloque-datos-dossier-acta select { margin-top: 4px; }
        .bloque-datos-dossier-acta label { display: block; margin-top: 8px; font-size: 0.65rem; font-weight: bold; text-transform: uppercase; color: #1b7a43; }
        .bloque-datos-dossier-acta label:first-of-type { margin-top: 4px; }
        .especialidad-fija { background: white; border: 1px solid #ddd; border-radius: 6px; padding: 6px 8px; margin-top: 6px; font-size: 0.75rem; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 6px; }
        .especialidad-fija .esp-check-label { display: flex; align-items: center; gap: 4px; font-weight: bold; }
        .especialidad-fija .esp-pn { display: flex; gap: 10px; }
        .especialidad-fija .esp-pn label { display: flex; align-items: center; gap: 3px; font-weight: normal; }
        .especialidad-otros-campos { width: 100%; margin-top: 6px; display: flex; flex-direction: column; gap: 4px; }
        .especialidad-otros-campos input, .especialidad-otros-campos textarea { width: 100%; box-sizing: border-box; }
        .perito-fila { display: flex; align-items: center; gap: 8px; background: white; border: 1px solid #ddd; border-radius: 6px; padding: 6px 8px; margin-top: 6px; font-size: 0.75rem; }
        .perito-fila .perito-label { font-weight: bold; flex: 0 0 auto; min-width: 90px; color: #1b7a43; }
        .perito-fila .perito-nombre { flex: 1; box-sizing: border-box; }
        .perito-vacio { font-size: 0.7rem; color: #888; font-style: italic; margin-top: 6px; }
        .bloque-accidentologia { background: #fff5f5; border: 1px solid #f1c0c0; border-radius: 6px; padding: 8px; margin-top: 8px; }
        .campo-accidentologia { margin-top: 8px; }
        .campo-accidentologia:first-of-type { margin-top: 4px; }
        .campo-accidentologia textarea { margin-top: 2px; }
        .lbl-accidentologia { display: block; font-size: 0.65rem; font-weight: bold; text-transform: uppercase; color: #d9534f; }
        .lbl-evidencia-area { display: block; margin-top: 8px; font-size: 0.65rem; font-weight: bold; text-transform: uppercase; color: #6f42c1; }
        .btn-add-evidencia { background: #8a63d2; color: white; border: none; padding: 6px; border-radius: 4px; width: 100%; margin-top: 6px; font-size: 0.65rem; font-weight: bold; cursor: pointer; }

        #btn-pdf-container { display: none; }
        .splash-org-text { color: white; margin-top: 14px; font-size: 1rem; font-weight: bold; letter-spacing: 1px; text-align: center; }
        .splash-clock { color: #25D366; margin-top: 8px; font-size: 0.85rem; font-weight: bold; letter-spacing: 0.5px; }
        .reloj-app { text-align: center; font-size: 0.75rem; font-weight: bold; color: #007bff; margin-top: 4px; margin-bottom: 8px; }
        .btn-wa { background-color: #25D366; color: white; padding: 16px; border: none; border-radius: 8px; font-weight: bold; width: 100%; margin-top: 20px; cursor: pointer; font-size: 1rem; text-transform: uppercase; }
        .btn-cloud { background-color: #4285F4; color: white; padding: 14px; border: none; border-radius: 8px; font-weight: bold; width: 100%; margin-top: 10px; cursor: pointer; font-size: 0.95rem; text-transform: uppercase; }
        .btn-cloud:disabled { opacity: 0.65; cursor: wait; }
        .btn-pdf { background-color: #d9534f; color: white; padding: 12px; border: none; border-radius: 8px; font-weight: bold; width: 100%; margin-top: 10px; cursor: pointer; font-size: 0.9rem; text-transform: uppercase; }
        .btn-word { background-color: #007bff; color: white; padding: 12px; border: none; border-radius: 8px; font-weight: bold; width: 100%; margin-top: 5px; cursor: pointer; font-size: 0.9rem; text-transform: uppercase; }
        .btn-reset { background-color: #f8f9fa; color: #d9534f; border: 1px solid #ccc; padding: 8px; border-radius: 4px; width: 100%; margin-top: 10px; font-size: 0.7rem; font-weight: bold;}
        .btn-tool { background: #e9ecef; border: 1px solid #ced4da; padding: 8px; border-radius: 4px; font-size: 0.65rem; font-weight: bold; cursor: pointer; flex: 1; text-align: center; }
        .btn-import { background-color: #007bff; color: white; padding: 12px; border: none; border-radius: 8px; font-weight: bold; width: 100%; margin-bottom: 15px; cursor: pointer; font-size: 0.9rem; text-transform: uppercase; }

        #sintesis { height: 100px; resize: vertical; }
        .historial { margin-top: 20px; background: #f4f6f8; padding: 10px; border-radius: 6px; font-size: 0.75rem; border: 1px solid #ddd; }
        .version-tag { text-align: center; margin-top: 12px; font-size: 0.6rem; font-weight: normal; text-transform: none; color: #aaa; }
        .creditos-tag { text-align: center; margin-top: 4px; font-size: 0.6rem; font-weight: normal; text-transform: none; color: #aaa; }
        .hist-item { border-bottom: 1px solid #ddd; padding: 10px 0; display: flex; flex-direction: column; gap: 5px; }
        .hist-item-botones { display: flex; gap: 6px; align-self: flex-end; }
        .btn-edit { background: #007bff; color: white; border: none; padding: 8px 12px; border-radius: 4px; font-size: 0.75rem; font-weight: bold; cursor: pointer; }
        .btn-borrar-hist { background: #d9534f; color: white; border: none; padding: 8px 12px; border-radius: 4px; font-size: 0.75rem; font-weight: bold; cursor: pointer; }

        @media print {
            body { background: white; padding: 0; }
            #splash-screen, #app-content { display: none !important; }
            #print-area { display: block !important; font-family: Arial, sans-serif; font-size: 12pt; line-height: 1.5; color: black; padding: 1.5cm; text-align: justify; }
            .campo-pdf { margin: 0 0 8pt 0; padding: 0; line-height: 1.5; text-align: justify; }
            .firma-contenedor { margin-top: 60px; display: flex; flex-direction: column; align-items: flex-end; }
            .firma-bloque { text-align: center; font-family: Arial, sans-serif; font-size: 9pt; font-weight: normal; line-height: 1.4; min-width: 280px; color: black; border-top: 1px dashed #333; padding-top: 5px; }
        }
        #print-area { display: none; }
    </style>

ooooAKKKKAP/Z";
    const TITULO_LABOR = "LABOR PERICIAL Y EVIDENCIAS";

    window.addEventListener('load', () => {
        inicializarActaUno();

        actualizarReloj();
        setInterval(actualizarReloj, 1000);

        setTimeout(() => {
            const splash = document.getElementById('splash-screen');
            const content = document.getElementById('app-content');
            splash.style.opacity = '0';
            setTimeout(() => {
                splash.style.display = 'none';
                content.style.display = 'block';
                dibujarHist();
            }, 800);
        }, 2500);
    });

    // ============ RELOJ EN TIEMPO REAL (fecha/hora del dispositivo) ============

    function actualizarReloj() {
        const ahora = new Date();
        const opcionesFecha = { timeZone: 'America/Argentina/Buenos_Aires', day: '2-digit', month: '2-digit', year: 'numeric' };
        const opcionesHora = { timeZone: 'America/Argentina/Buenos_Aires', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false };
        const fechaStr = ahora.toLocaleDateString('es-AR', opcionesFecha);
        const horaStr = ahora.toLocaleTimeString('es-AR', opcionesHora);
        const texto = `🕐 ${fechaStr} - ${horaStr} hs`;

        const splashReloj = document.getElementById('splashReloj');
        if (splashReloj) splashReloj.innerText = texto;

        const relojApp = document.getElementById('relojApp');
        if (relojApp) relojApp.innerText = texto;
    }

    // ============ ACTAS / INTERVENCIONES ============

    function inicializarActaUno() {
        const opciones = { timeZone: 'America/Argentina/Buenos_Aires', year: 'numeric', month: '2-digit', day: '2-digit' };
        const fechaLocal = new Date().toLocaleDateString('zh-Hans-CN', opciones).replace(/\//g, '-');
        document.getElementById('acta1-fecha').value = fechaLocal;
        agregarSubBloqueDatosPU(1);
        agregarSubBloqueDossier(1);
    }

    // "Datos para P.U." se despliega TODO junto, debajo del botón "Cargar datos para P.U"
    // (no adentro de cada acta): un sub-bloque por cada acta existente.
    function agregarSubBloqueDatosPU(actaId) {
        const contenedor = document.getElementById('contenedorDatosPU');
        if (!contenedor) return;
        const div = document.createElement('div');
        div.className = 'bloque-datos-pu-acta';
        div.setAttribute('data-acta-id', actaId);
        div.innerHTML = `
            <div class="subtitulo-dossier" style="color:#6f42c1; margin-top:0;">📄 Acta ${actaId}<span class="pu-acta-lef"></span></div>
            <label>Hora de Inicio del Acta</label>
            <input type="text" class="pu-hora-inicio" placeholder="Ej: 08:15">
            <div class="listaEspecialidades"></div>
            <div style="margin-top:10px;">
                <label>🔗 Cadena de custodia — a Instrucción (opcional) — solo los códigos, separados por coma</label>
                <textarea class="custodia-texto" rows="1" placeholder="Ej: B4, B5, B6, B7"></textarea>
            </div>
            <div style="margin-top:10px;">
                <label>🧬 Evidencias remitidas a A.F.I.S. (opcional) — solo los códigos, separados por coma</label>
                <textarea class="custodia-afis-texto" rows="1" placeholder="Ej: D7, D8, D10, D11"></textarea>
            </div>`;
        contenedor.appendChild(div);
        const lista = div.querySelector('.listaEspecialidades');
        ESPECIALIDADES_FIJAS.forEach(nombre => lista.appendChild(filaEspecialidadFija(actaId, nombre)));
        lista.appendChild(filaEspecialidadOtros(actaId));
        refrescarSubtituloDatosPU(actaId);
    }

    // Lee el LEF de esta acta (fija para la 1, dinámica para el resto) y lo muestra al lado
    // de "📄 Acta N" en Datos para P.U., para saber de un vistazo a qué acta corresponde.
    function refrescarSubtituloDatosPU(actaId) {
        const lefInput = String(actaId) === '1' ? document.getElementById('acta1-lef') : document.querySelector(`#acta-bloque-${actaId} .acta-lef`);
        const lef = lefInput ? lefInput.value.trim() : '';
        const span = document.querySelector(`#contenedorDatosPU [data-acta-id="${actaId}"] .pu-acta-lef`);
        if (span) span.textContent = lef ? ` — ${lef}` : '';
    }
    function refrescarSubtitulosDatosPU() {
        document.querySelectorAll('#contenedorDatosPU .bloque-datos-pu-acta').forEach(bloque => {
            refrescarSubtituloDatosPU(bloque.getAttribute('data-acta-id'));
        });
    }

    // "Datos para Dossier" sigue el mismo patrón: un sub-bloque por acta, debajo del botón
    // "Cargar datos para Dossier". A diferencia de "Datos para P.U.", acá arriba de los
    // sub-bloques por acta hay dos campos que van UNA sola vez para todo el reporte
    // (I.P.P., ya que Instructora se toma directo de Seccional Actuante), fijo en el HTML
    // dentro de #bloqueDatosDossier.
    function agregarSubBloqueDossier(actaId) {
        const contenedor = document.getElementById('contenedorDatosDossier');
        if (!contenedor) return;
        const div = document.createElement('div');
        div.className = 'bloque-datos-dossier-acta';
        div.setAttribute('data-acta-id', actaId);
        div.innerHTML = `
            <div class="subtitulo-dossier" style="color:#1b7a43; margin-top:0;">📄 Acta ${actaId}<span class="dossier-acta-lef"></span></div>
            <label>Resultado</label>
            <select class="dossier-resultado">
                <option value="">--- Resultado ---</option>
                <option value="POSITIVO">Positivo</option>
                <option value="NEGATIVO">Negativo</option>
            </select>
            <label>Peritos intervinientes</label>
            <div class="listaPeritos"></div>`;
        contenedor.appendChild(div);
        refrescarSubtituloDossier(actaId);
        refrescarPeritosDossier(actaId);
    }

    // "Peritos Intervinientes" no se escribe libre: aparece un renglón por cada especialidad
    // tildada en Datos para P.U. de esa misma acta (Fotografía, Rastros...), con un campo en
    // blanco al lado para que el usuario cargue el nombre de quién la hizo. Al re-generar la
    // lista (porque se tildó/destildó algo en P.U.) se conservan los nombres ya cargados para
    // las especialidades que sigan marcadas.
    function refrescarPeritosDossier(actaId) {
        const sub = document.querySelector(`#contenedorDatosDossier [data-acta-id="${actaId}"]`);
        if (!sub) return;
        const contenedor = sub.querySelector('.listaPeritos');
        if (!contenedor) return;
        const nombresPrevios = {};
        contenedor.querySelectorAll('.perito-fila').forEach(fila => {
            nombresPrevios[fila.getAttribute('data-especialidad')] = fila.querySelector('.perito-nombre').value;
        });
        const marcadas = leerEspecialidadesMarcadas(actaId);
        contenedor.innerHTML = marcadas.length ? '' : '<div class="perito-vacio">Marcá especialidades en "Datos para P.U." para que aparezcan acá.</div>';
        marcadas.forEach(nombre => {
            const div = document.createElement('div');
            div.className = 'perito-fila';
            div.setAttribute('data-especialidad', nombre);
            const valorPrevio = (nombresPrevios[nombre] || '').replace(/"/g, '&quot;');
            div.innerHTML = `
                <label class="perito-label">${nombre}</label>
                <input type="text" class="perito-nombre" placeholder="Ej: Subcomisario BETANZOS, Federico Adrian" value="${valorPrevio}">`;
            contenedor.appendChild(div);
        });
    }
    function refrescarPeritosDossierTodas() {
        document.querySelectorAll('#contenedorDatosDossier .bloque-datos-dossier-acta').forEach(bloque => {
            refrescarPeritosDossier(bloque.getAttribute('data-acta-id'));
        });
    }

    // Mismo criterio que refrescarSubtituloDatosPU(): mostrar el LEF de la acta al lado de
    // "📄 Acta N" para saber a qué acta corresponde de un vistazo.
    function refrescarSubtituloDossier(actaId) {
        const lefInput = String(actaId) === '1' ? document.getElementById('acta1-lef') : document.querySelector(`#acta-bloque-${actaId} .acta-lef`);
        const lef = lefInput ? lefInput.value.trim() : '';
        const span = document.querySelector(`#contenedorDatosDossier [data-acta-id="${actaId}"] .dossier-acta-lef`);
        if (span) span.textContent = lef ? ` — ${lef}` : '';
    }
    function refrescarSubtitulosDossier() {
        document.querySelectorAll('#contenedorDatosDossier .bloque-datos-dossier-acta').forEach(bloque => {
            refrescarSubtituloDossier(bloque.getAttribute('data-acta-id'));
        });
    }

    function datosDossierDeActa(actaId) {
        const sub = document.querySelector(`#contenedorDatosDossier [data-acta-id="${actaId}"]`);
        if (!sub) return { resultado: "", peritos: [] };
        const peritos = Array.from(sub.querySelectorAll('.perito-fila')).map(fila => ({
            especialidad: fila.getAttribute('data-especialidad'),
            nombre: fila.querySelector('.perito-nombre').value.trim()
        })).filter(p => p.nombre);
        return {
            resultado: sub.querySelector('.dossier-resultado').value,
            peritos
        };
    }

    // Los renglones de Peritos ya se generan solos a partir de las especialidades marcadas
    // (refrescarPeritosDossier); acá solo hace falta volcar los nombres guardados en cada uno.
    function cargarDatosDossierEnActa(actaId, dossier) {
        if (!dossier) return;
        const sub = document.querySelector(`#contenedorDatosDossier [data-acta-id="${actaId}"]`);
        if (!sub) return;
        if (dossier.resultado) sub.querySelector('.dossier-resultado').value = dossier.resultado;
        (dossier.peritos || []).forEach(p => {
            const fila = sub.querySelector(`.perito-fila[data-especialidad="${CSS.escape(p.especialidad)}"]`);
            if (fila) fila.querySelector('.perito-nombre').value = p.nombre;
        });
    }

    function toggleDatosDossier() {
        mostrarDatosDossier = !mostrarDatosDossier;
        actualizarVisibilidadDatosDossier();
    }

    function actualizarVisibilidadDatosDossier() {
        const bloque = document.getElementById('bloqueDatosDossier');
        if (bloque) bloque.style.display = mostrarDatosDossier ? 'block' : 'none';
        const btn = document.getElementById('btnCargarDatosDossier');
        if (btn) btn.innerText = mostrarDatosDossier ? '➖ Ocultar datos para Dossier' : '➕ Cargar datos para Dossier';
        if (mostrarDatosDossier) { refrescarSubtitulosDossier(); refrescarPeritosDossierTodas(); }
    }

    // Crea una acta adicional (la 1ª ya está fija en el formulario). Se agrega al final,
    // debajo del botón, sin afectar la posición de los campos de arriba.
    function agregarBloqueActa(datos = null) {
        contadorActas++;
        const id = contadorActas;
        const container = document.getElementById('contenedor-actas-nuevas');

        const opciones = { timeZone: 'America/Argentina/Buenos_Aires', year: 'numeric', month: '2-digit', day: '2-digit' };
        const fechaLocal = new Date().toLocaleDateString('zh-Hans-CN', opciones).replace(/\//g, '-');

        const html = `
        <div class="bloque-acta" id="acta-bloque-${id}">
            <div class="header-acta">
                <span class="titulo-acta">ACTA / INTERVENCIÓN #${id}</span>
                <button type="button" class="btn-remove-acta" onclick="eliminarBloqueActa(${id})">✕ Eliminar</button>
            </div>
            <div class="row">
                <div style="flex:1">
                    <label>🔢 LEF/A.R.A</label>
                    <input type="text" class="acta-lef" value="${datos && datos.lef && datos.lef !== '---' ? datos.lef : '4436-00000-2026'}" oninput="refrescarSubtituloDatosPU(${id}); refrescarSubtituloDossier(${id})">
                </div>
                <div style="flex:1">
                    <label>📅 FECHA</label>
                    <input type="date" class="acta-fecha" value="${datos ? datos.fechaRaw : fechaLocal}">
                </div>
            </div>
            <label>⏰ Horarios (Solicitud / Salida / Fin)</label>
            <div class="row">
                <div style="flex:1"><input type="text" class="acta-hsol" placeholder="Solic. (0800)" value="${datos ? datos.h_sol : ''}"></div>
                <div style="flex:1"><input type="text" class="acta-hsal" placeholder="Salida (0815)" value="${datos ? datos.h_sal : ''}"></div>
                <div style="flex:1"><input type="text" class="acta-hfin" placeholder="Fin. (1130)" value="${datos ? datos.h_fin : ''}"></div>
            </div>
            <label>📍 Lugar del hecho</label>
            <input type="text" class="acta-lugar" placeholder="Calle/Ruta..." value="${datos ? datos.lugar : ''}">
            <div class="row" style="margin-top:5px">
                <input type="text" class="acta-gps" placeholder="Coordenadas" style="flex:2" value="${datos ? datos.gps : ''}">
                <div class="btn-tool" onclick="obtenerGpsActa(${id})">📡 MI GPS</div>
                <div class="btn-tool" onclick="window.open('https://www.google.com.ar/maps')">🗺️ MAPA</div>
                <div class="btn-tool" onclick="pegarEnActa(${id})">📋 PEGAR</div>
            </div>

            <!-- Contenedor oculto: compatibilidad con LEFs adicionales de historiales antiguos (sin UI) -->
            <div class="listaLefsExtra" style="display:none;"></div>

            <!-- LABOR PERICIAL Y EVIDENCIAS de esta acta, oculta hasta el modo edición -->
            <div class="seccion-labor-acta">
                <label style="color:#25D366; margin-top:0;">📑 LABOR PERICIAL Y EVIDENCIAS</label>

                <!-- Accidentología (solo visible si se tildó 🟡 L. Culposas): campos fijos a completar -->
                <div class="bloque-accidentologia" style="display:none;">
                    <div class="subtitulo-dossier" style="color:#d9534f; margin-top:0;">🚧 Accidentología</div>
                    <div class="campo-accidentologia"><span class="lbl-accidentologia">FASE PRECEDENTE:</span><textarea class="acc-fase_precedente" rows="2" placeholder="A completar..."></textarea></div>
                    <div class="campo-accidentologia"><span class="lbl-accidentologia">FASE DE CONTACTO:</span><textarea class="acc-fase_contacto" rows="2" placeholder="A completar..."></textarea></div>
                    <div class="campo-accidentologia"><span class="lbl-accidentologia">POSICIÓN FINAL:</span><textarea class="acc-posicion_final" rows="2" placeholder="A completar..."></textarea></div>
                    <div class="campo-accidentologia"><span class="lbl-accidentologia">INDICIOS ACCIDENTOLÓGICOS:</span><textarea class="acc-indicios" rows="2" placeholder="A completar..."></textarea></div>
                    <div class="campo-accidentologia"><span class="lbl-accidentologia">TIPO DE COLISIÓN:</span><textarea class="acc-tipo_colision" rows="2" placeholder="A completar..."></textarea></div>
                </div>

                <div class="listaAreasLabor"></div>
                <button type="button" class="btn-add-row" style="background:#25D366;" onclick="agregarAreaLabor(${id})">➕ AGREGAR ÁREA</button>
            </div>
        </div>`;

        container.insertAdjacentHTML('beforeend', html);
        renumerarTitulosActas();
        agregarSubBloqueDatosPU(id);
        agregarSubBloqueDossier(id);

        if (datos) {
            (datos.lefs_extra || []).forEach(v => agregarLefExtra(id, v));
            (datos.areas || []).forEach(a => agregarAreaLabor(id, a.area, a.evidencias || []));
            (datos.especialidades || []).forEach(e => agregarEspecialidad(id, e.especialidad, e.resultado));
            if (datos.custodia) {
                const campoCustodia = document.querySelector(`#contenedorDatosPU [data-acta-id="${id}"] .custodia-texto`);
                if (campoCustodia) campoCustodia.value = datos.custodia;
            }
            if (datos.custodiaAfis) {
                const campoCustodiaAfis = document.querySelector(`#contenedorDatosPU [data-acta-id="${id}"] .custodia-afis-texto`);
                if (campoCustodiaAfis) campoCustodiaAfis.value = datos.custodiaAfis;
            }
            if (datos.horaInicio) {
                const campoHoraInicio = document.querySelector(`#contenedorDatosPU [data-acta-id="${id}"] .pu-hora-inicio`);
                if (campoHoraInicio) campoHoraInicio.value = datos.horaInicio;
            }
            refrescarPeritosDossier(id);
            cargarDatosDossierEnActa(id, datos.dossier);
            if (datos.accidentologia) {
                const bloqueNuevo = document.getElementById(`acta-bloque-${id}`);
                if (bloqueNuevo) cargarAccidentologiaEnBloque(bloqueNuevo, datos.accidentologia);
            }
        }

        if (modoEdicionActivo) {
            actualizarVisibilidadLabor();
        }
        actualizarVisibilidadAccidentologia();
        actualizarVisibilidadDatosPU();
    }

    function eliminarBloqueActa(id) {
        const el = document.getElementById(`acta-bloque-${id}`);
        if (el) el.remove();
        const subBloquePU = document.querySelector(`#contenedorDatosPU [data-acta-id="${id}"]`);
        if (subBloquePU) subBloquePU.remove();
        const subBloqueDossier = document.querySelector(`#contenedorDatosDossier [data-acta-id="${id}"]`);
        if (subBloqueDossier) subBloqueDossier.remove();
        renumerarTitulosActas();
        refrescarLetrasAreas();
    }

    function renumerarTitulosActas() {
        // La acta #1 ya está fija en el formulario (sin tarjeta propia), por eso las
        // tarjetas dinámicas arrancan a numerarse desde la #2.
        document.querySelectorAll('#contenedor-actas-nuevas .bloque-acta').forEach((bloque, index) => {
            const span = bloque.querySelector('.titulo-acta');
            if (span) span.innerText = `ACTA / INTERVENCIÓN #${index + 2}`;
        });
    }

    function actualizarVisibilidadLabor() {
        // "Agregar otra acta" NO se toca acá: está siempre visible desde la primera carga
        // (puede haber más de un LEF/A.R.A desde el inicio). Solo la Labor Pericial de cada
        // acta (áreas/evidencias) sigue oculta hasta el modo edición.
        document.querySelectorAll('.seccion-labor-acta').forEach(el => {
            el.style.display = modoEdicionActivo ? 'block' : 'none';
        });
    }

    // ============ ACCIDENTOLOGÍA (solo cuando está tildado 🟡 L. Culposas) ============

    const CAMPOS_ACCIDENTOLOGIA = [
        ['fase_precedente', 'FASE PRECEDENTE'],
        ['fase_contacto', 'FASE DE CONTACTO'],
        ['posicion_final', 'POSICIÓN FINAL'],
        ['indicios', 'INDICIOS ACCIDENTOLÓGICOS'],
        ['tipo_colision', 'TIPO DE COLISIÓN']
    ];

    // La acta 1 es siempre la de "peritos en rastros" (Área/Evidencia normal, sin Accidentología).
    // Cuando el hecho tiene 🟡 L. Culposas, la Accidentología va aparte, en una 2ª acta dedicada
    // a esa parte del trabajo (misma causa, LEF/intervención distinta) — si no existe, se crea sola
    // al entrar en modo edición o al tildar el sticker.
    function actualizarVisibilidadAccidentologia() {
        const esCulposas = document.getElementById('checkCulposas').checked;

        if (modoEdicionActivo && esCulposas) {
            const totalActas = 1 + document.querySelectorAll('#contenedor-actas-nuevas .bloque-acta').length;
            if (totalActas < 2) agregarBloqueActa();
        }

        document.querySelectorAll('.bloque-accidentologia').forEach(el => {
            el.style.display = esCulposas ? 'block' : 'none';
        });
    }

    // Las tarjetas dinámicas (acta 2 en adelante) usan clases .acc-* dentro del bloque de la acta.
    function leerAccidentologiaDeBloque(bloque) {
        const datos = {};
        CAMPOS_ACCIDENTOLOGIA.forEach(([clave]) => {
            const campo = bloque.querySelector(`.acc-${clave}`);
            datos[clave] = campo ? campo.value.trim() : "";
        });
        return datos;
    }

    function cargarAccidentologiaEnBloque(bloque, datos) {
        CAMPOS_ACCIDENTOLOGIA.forEach(([clave]) => {
            const campo = bloque.querySelector(`.acc-${clave}`);
            if (campo) campo.value = (datos && datos[clave]) || "";
        });
    }

    function formatearAccidentologiaTexto(acc) {
        if (!acc || !CAMPOS_ACCIDENTOLOGIA.some(([clave]) => acc[clave])) return "";
        return CAMPOS_ACCIDENTOLOGIA.map(([clave, etiqueta]) => `*${etiqueta}:* ${acc[clave] || ""}`).join("\n");
    }

    function formatearAccidentologiaHTML(acc) {
        if (!acc || !CAMPOS_ACCIDENTOLOGIA.some(([clave]) => acc[clave])) return "";
        return CAMPOS_ACCIDENTOLOGIA.map(([clave, etiqueta]) => `<b>${etiqueta}:</b> ${acc[clave] || ""}`).join("<br>");
    }

    // ============ DATOS PARA P.U. (Especialidad + Resultado, por acta — solo van al Word/P.U.) ============

    function toggleDatosPU() {
        mostrarDatosPU = !mostrarDatosPU;
        actualizarVisibilidadDatosPU();
    }

    function actualizarVisibilidadDatosPU() {
        const contenedor = document.getElementById('contenedorDatosPU');
        if (contenedor) contenedor.style.display = mostrarDatosPU ? 'block' : 'none';
        const btn = document.getElementById('btnCargarDatosPU');
        if (btn) btn.innerText = mostrarDatosPU ? '➖ Ocultar datos para P.U' : '➕ Cargar datos para P.U';
        if (mostrarDatosPU) refrescarSubtitulosDatosPU();
    }

    // Lista fija de especialidades (checkbox + Positivo/Negativo cada una). "Otros" se agrega
    // aparte porque es la única con texto libre (nombre + resultado escritos a mano).
    const ESPECIALIDADES_FIJAS = ['Coordinación', 'Fotografía', 'Rastros', 'Planimetría', 'Balística', 'Química', 'Accidentología', 'Mecánica', 'Dibujo de Rostro', 'Morgue', 'A.F.I.S.'];

    // Especialidades cuyo "Positivo" no se lee como "Positivo." sino con una frase fija propia.
    const TEXTO_FIJO_ESPECIALIDAD_POSITIVO = {
        'Planimetría': 'Se llevó a cabo croquis con toma de medidas, para confección de posterior plano a escala.'
    };

    function filaEspecialidadFija(actaId, nombre) {
        const slug = nombre.normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^A-Za-z0-9]/g, '');
        const div = document.createElement('div');
        div.className = 'especialidad-fija';
        div.setAttribute('data-nombre', nombre);
        div.innerHTML = `
            <label class="esp-check-label"><input type="checkbox" class="esp-check" onchange="refrescarPeritosDossier(${actaId})"> ${nombre}</label>
            <span class="esp-pn">
                <label><input type="radio" name="esp-pn-${actaId}-${slug}" value="Positivo" class="esp-radio-positivo"> Positivo</label>
                <label><input type="radio" name="esp-pn-${actaId}-${slug}" value="Negativo" class="esp-radio-negativo"> Negativo</label>
            </span>`;
        return div;
    }
    function filaEspecialidadOtros(actaId) {
        const div = document.createElement('div');
        div.className = 'especialidad-fija especialidad-otros';
        div.setAttribute('data-nombre', 'Otros');
        div.innerHTML = `
            <label class="esp-check-label"><input type="checkbox" class="esp-check" onchange="this.closest('.especialidad-otros').querySelector('.especialidad-otros-campos').style.display = this.checked ? 'flex' : 'none'; refrescarPeritosDossier(${actaId});"> Otros</label>
            <div class="especialidad-otros-campos" style="display:none;">
                <input type="text" class="esp-otros-nombre" placeholder="Nombre de la especialidad" oninput="refrescarPeritosDossier(${actaId})">
                <textarea class="esp-otros-resultado" rows="1" placeholder="Resultado"></textarea>
            </div>`;
        return div;
    }
    function contenedorEspecialidades(actaId) {
        const subBloque = document.querySelector(`#contenedorDatosPU [data-acta-id="${actaId}"]`);
        return subBloque ? subBloque.querySelector('.listaEspecialidades') : null;
    }
    // Compatibilidad con reportes guardados (editar()): si el nombre coincide (sin tildes/mayúsculas)
    // con una especialidad fija, marca su checkbox y el Positivo/Negativo correspondiente; si no
    // coincide con ninguna, se acumula en el renglón libre "Otros" (concatenando si ya había algo).
    function agregarEspecialidad(actaId, especialidad = "", resultado = "") {
        if (!especialidad && !resultado) return;
        const lista = contenedorEspecialidades(actaId);
        if (!lista) return;
        const nombreNorm = quitarAcentos(especialidad).trim().toLowerCase();
        const filaFija = Array.from(lista.querySelectorAll('.especialidad-fija:not(.especialidad-otros)'))
            .find(f => quitarAcentos(f.getAttribute('data-nombre')).toLowerCase() === nombreNorm);
        if (filaFija) {
            filaFija.querySelector('.esp-check').checked = true;
            const resNorm = quitarAcentos(resultado).trim().toLowerCase();
            if (resNorm.startsWith('positivo')) filaFija.querySelector('.esp-radio-positivo').checked = true;
            else if (resNorm.startsWith('negativo')) filaFija.querySelector('.esp-radio-negativo').checked = true;
            return;
        }
        const filaOtros = lista.querySelector('.especialidad-otros');
        if (!filaOtros) return;
        filaOtros.querySelector('.esp-check').checked = true;
        filaOtros.querySelector('.especialidad-otros-campos').style.display = 'flex';
        const campoNombre = filaOtros.querySelector('.esp-otros-nombre');
        const campoResultado = filaOtros.querySelector('.esp-otros-resultado');
        campoNombre.value = campoNombre.value ? `${campoNombre.value}; ${especialidad}` : especialidad;
        campoResultado.value = campoResultado.value ? `${campoResultado.value}; ${resultado}` : resultado;
    }
    function leerEspecialidades(actaId) {
        const lista = contenedorEspecialidades(actaId);
        if (!lista) return [];
        const resultado = [];
        lista.querySelectorAll('.especialidad-fija').forEach(fila => {
            if (!fila.querySelector('.esp-check').checked) return;
            if (fila.classList.contains('especialidad-otros')) {
                const nombreOtros = fila.querySelector('.esp-otros-nombre').value.trim();
                const resultadoOtros = fila.querySelector('.esp-otros-resultado').value.trim();
                if (nombreOtros || resultadoOtros) resultado.push({ especialidad: nombreOtros, resultado: resultadoOtros });
            } else {
                const nombre = fila.getAttribute('data-nombre');
                // Se guarda aunque todavía no se haya elegido Positivo/Negativo (resultado ""),
                // para que el tilde en sí sobreviva un guardado/reedición — formatearEspecialidadesHTML
                // se encarga de no imprimir nada en el P.U. hasta que sí se elija.
                const pn = fila.querySelector('.esp-radio-positivo').checked ? 'Positivo' : (fila.querySelector('.esp-radio-negativo').checked ? 'Negativo' : '');
                resultado.push({ especialidad: nombre, resultado: pn });
            }
        });
        return resultado;
    }
    // Nombres de las especialidades tildadas en Datos para P.U. de esta acta (sin importar si
    // ya se eligió Positivo/Negativo) — es lo que alimenta "Peritos Intervinientes" del Dossier.
    function leerEspecialidadesMarcadas(actaId) {
        const lista = contenedorEspecialidades(actaId);
        if (!lista) return [];
        const resultado = [];
        lista.querySelectorAll('.especialidad-fija').forEach(fila => {
            if (!fila.querySelector('.esp-check').checked) return;
            if (fila.classList.contains('especialidad-otros')) {
                const nombreOtros = fila.querySelector('.esp-otros-nombre').value.trim();
                if (nombreOtros) resultado.push(nombreOtros);
            } else {
                resultado.push(fila.getAttribute('data-nombre'));
            }
        });
        return resultado;
    }
    function leerCadenaCustodia(actaId) {
        const subBloque = document.querySelector(`#contenedorDatosPU [data-acta-id="${actaId}"]`);
        const campo = subBloque ? subBloque.querySelector('.custodia-texto') : null;
        return campo ? campo.value.trim() : "";
    }
    function leerCadenaCustodiaAfis(actaId) {
        const subBloque = document.querySelector(`#contenedorDatosPU [data-acta-id="${actaId}"]`);
        const campo = subBloque ? subBloque.querySelector('.custodia-afis-texto') : null;
        return campo ? campo.value.trim() : "";
    }
    function leerHoraInicioActa(actaId) {
        const subBloque = document.querySelector(`#contenedorDatosPU [data-acta-id="${actaId}"]`);
        const campo = subBloque ? subBloque.querySelector('.pu-hora-inicio') : null;
        return campo ? campo.value.trim() : "";
    }
    // Las especialidades fijas (excepto "Otros") van en MAYÚSCULA y con Positivo./Negativo. fijo,
    // salvo que tengan una frase propia (ej. Planimetría). "Otros" respeta el texto tal cual se
    // escribió, sin mayúsculas forzadas ni punto final automático (es texto libre).
    function formatearEspecialidadesHTML(especialidades) {
        if (!especialidades || !especialidades.length) return "";
        return especialidades.map(e => {
            if (!e.especialidad) return "";
            const esFija = ESPECIALIDADES_FIJAS.includes(e.especialidad);
            if (esFija) {
                if (!e.resultado) return ""; // tildada pero todavía sin Positivo/Negativo: no imprime nada
                const fijo = TEXTO_FIJO_ESPECIALIDAD_POSITIVO[e.especialidad];
                const texto = (fijo && e.resultado === 'Positivo') ? fijo : `${e.resultado}.`;
                return `<b>${e.especialidad.toUpperCase()}:</b> ${texto}`;
            }
            return `<b>${e.especialidad}:</b> ${e.resultado || ""}`;
        }).filter(Boolean).join("<br>");
    }

    function inputGpsDeActa(id) {
        return id === 1 ? document.getElementById('acta1-gps') : document.querySelector(`#acta-bloque-${id} .acta-gps`);
    }

    async function pegarEnActa(id) {
        try {
            const text = await navigator.clipboard.readText();
            const input = inputGpsDeActa(id);
            if (input) input.value = text;
        } catch(e) {
            alert("Pegue manualmente.");
        }
    }

    function obtenerGpsActa(id) {
        if (!navigator.geolocation) {
            alert("Este dispositivo/navegador no permite obtener la ubicación automáticamente. Pegue las coordenadas manualmente.");
            return;
        }
        navigator.geolocation.getCurrentPosition(
            (pos) => {
                const lat = pos.coords.latitude.toFixed(6);
                const lng = pos.coords.longitude.toFixed(6);
                const input = inputGpsDeActa(id);
                if (input) input.value = `${lat}, ${lng}`;
            },
            (err) => {
                alert("No se pudo obtener la ubicación: " + err.message);
            },
            { enableHighAccuracy: true, timeout: 10000 }
        );
    }

    // ============ LEF ADICIONALES (por acta) ============

    function filaLefExtra(valor = "") {
        const div = document.createElement('div');
        div.className = 'dyn-row';
        div.innerHTML = `
            <input type="text" class="lef-extra-valor col-grande" placeholder="Ej: 4436-01234-2026" value="${valor.replace(/"/g,'&quot;')}">
            <button type="button" class="btn-remove-row" onclick="this.parentElement.remove()">✖</button>`;
        return div;
    }
    function contenedorLefsExtra(actaId) {
        if (actaId === 1) return document.getElementById('acta1-listaLefsExtra');
        const bloque = document.getElementById(`acta-bloque-${actaId}`);
        return bloque ? bloque.querySelector('.listaLefsExtra') : null;
    }
    function agregarLefExtra(actaId, valor = "") {
        const lista = contenedorLefsExtra(actaId);
        if (lista) lista.appendChild(filaLefExtra(valor));
    }
    function leerLefsExtra(bloque) {
        return Array.from(bloque.querySelectorAll('.listaLefsExtra .lef-extra-valor'))
            .map(input => input.value.trim())
            .filter(Boolean);
    }

    // ============ ÁREAS Y EVIDENCIAS / LABOR PERICIAL (por acta) ============

    function filaEvidenciaLabor(desc = "") {
        const div = document.createElement('div');
        div.className = 'dyn-row';
        div.innerHTML = `
            <textarea class="ev-labor-desc col-grande" rows="2" placeholder="Evidencia (Ej: Exploración negativa de rastros)">${desc}</textarea>
            <button type="button" class="btn-remove-row" onclick="this.parentElement.remove()">✖</button>`;
        return div;
    }
    function agregarEvidenciaLabor(btnEl) {
        btnEl.previousElementSibling.appendChild(filaEvidenciaLabor());
    }
    function filaAreaLabor(nombre = "", evidencias = []) {
        const div = document.createElement('div');
        div.className = 'area-block';
        div.innerHTML = `
            <div class="dyn-row">
                <span class="area-letra-badge">?</span>
                <input type="text" class="area-labor-nombre col-grande" placeholder="Área (Ej: galpón)" value="${nombre.replace(/"/g,'&quot;')}">
                <button type="button" class="btn-remove-row" onclick="this.closest('.area-block').remove(); refrescarLetrasAreas();">✖</button>
            </div>
            <label class="lbl-evidencia-area">Evidencia:</label>
            <div class="lista-evidencias-labor"></div>
            <button type="button" class="btn-add-evidencia" onclick="agregarEvidenciaLabor(this)">➕ AGREGAR EVIDENCIA</button>`;
        const listaEv = div.querySelector('.lista-evidencias-labor');
        evidencias.forEach(e => listaEv.appendChild(filaEvidenciaLabor(e)));
        return div;
    }
    // Letra de referencia (A, B, C...) al lado de cada área, para que el perito ubique de
    // un vistazo en qué letra va a salir cada una en el P.U./Dossier — es SOLO una ayuda
    // visual del formulario: nunca se manda al extracto de WhatsApp ni al PDF.
    function refrescarLetrasAreas() {
        const contenedores = [
            document.getElementById('acta1-listaAreasLabor'),
            ...Array.from(document.querySelectorAll('#contenedor-actas-nuevas .bloque-acta .listaAreasLabor'))
        ];
        let i = 0;
        contenedores.forEach(contenedor => {
            if (!contenedor) return;
            contenedor.querySelectorAll('.area-block').forEach(bloque => {
                const badge = bloque.querySelector('.area-letra-badge');
                if (badge) badge.textContent = letraDeArea(i);
                i++;
            });
        });
    }
    function contenedorAreasLabor(actaId) {
        if (actaId === 1) return document.getElementById('acta1-listaAreasLabor');
        const bloque = document.getElementById(`acta-bloque-${actaId}`);
        return bloque ? bloque.querySelector('.listaAreasLabor') : null;
    }
    function agregarAreaLabor(actaId, nombre = "", evidencias = []) {
        const lista = contenedorAreasLabor(actaId);
        if (lista) lista.appendChild(filaAreaLabor(nombre, evidencias));
        refrescarLetrasAreas();
    }
    function leerAreasLabor(bloque) {
        return Array.from(bloque.querySelectorAll('.listaAreasLabor .area-block')).map(block => ({
            area: block.querySelector('.area-labor-nombre').value.trim(),
            evidencias: Array.from(block.querySelectorAll('.lista-evidencias-labor textarea')).map(t => t.value.trim()).filter(Boolean)
        })).filter(a => a.area || a.evidencias.length);
    }
    // Un área sin evidencias no se manda por WhatsApp/PDF (solo aparece en el P.U./Dossier,
    // donde igual cuenta su lugar en el orden para la letra que le corresponde).
    function formatearAreasTexto(areas) {
        return areas.filter(a => a.evidencias && a.evidencias.length).map(a => {
            const lineas = [];
            if (a.area) lineas.push(`*${a.area}*`);
            a.evidencias.forEach(e => {
                e.split("\n").map(l => l.trim()).filter(Boolean).forEach(l => lineas.push(`* ${l}`));
            });
            return lineas.join("\n");
        }).filter(Boolean).join("\n");
    }
    function formatearAreasHTML(areas) {
        return areas.filter(a => a.evidencias && a.evidencias.length).map(a => {
            const lineas = [];
            if (a.area) lineas.push(`<b>${a.area}</b>`);
            a.evidencias.forEach(e => {
                e.split("\n").map(l => l.trim()).filter(Boolean).forEach(l => lineas.push(`- ${l}`));
            });
            return lineas.join("<br>");
        }).filter(Boolean).join("<br>");
    }

    // ============ UTILIDADES DE FORMATO ============

    function aFormatoTitulo(texto) {
        if (!texto) return "---";
        return texto.trim().toLowerCase().replace(/(?:^|\s)\S/g, function(a) { return a.toUpperCase(); });
    }

    function formatearFechaSalida(fechaInput) {
        if (!fechaInput) return "---";
        const partes = fechaInput.split("-");
        if (partes.length === 3) return `${partes[2]}/${partes[1]}/${partes[0]}`;
        return fechaInput;
    }

    function convertirFechaParaInput(fechaTexto) {
        if (!fechaTexto) return "";
        const partes = fechaTexto.match(/(\d{1,2})[\/\- ](\d{1,2})[\/\- ](\d{4})/);
        if (partes) return `${partes[3]}-${partes[2].padStart(2, '0')}-${partes[1].padStart(2, '0')}`;
        return "";
    }

    function formatearHoraVal(v, esFin = false) {
        v = (v || "").trim();
        if (!v || v === "---") return esFin ? "" : "---";
        if (/^\d{3,4}$/.test(v)) {
            if (v.length === 3) v = "0" + v;
            v = v.substring(0, 2) + ":" + v.substring(2);
        }
        return v;
    }

    // ============ RECOLECCIÓN Y CONSTRUCCIÓN DE DATOS ============

    function recolectarDatosActas() {
        // La 1ª acta vive en campos fijos del formulario (no en una tarjeta .bloque-acta).
        const acta1 = {
            lef: document.getElementById('acta1-lef').value.trim() || "---",
            fechaRaw: document.getElementById('acta1-fecha').value,
            fecha: formatearFechaSalida(document.getElementById('acta1-fecha').value),
            h_sol: formatearHoraVal(document.getElementById('acta1-hsol').value),
            h_sal: formatearHoraVal(document.getElementById('acta1-hsal').value),
            h_fin: formatearHoraVal(document.getElementById('acta1-hfin').value, true),
            lugar: aFormatoTitulo(document.getElementById('acta1-lugar').value),
            gps: document.getElementById('acta1-gps').value.trim() || "---",
            lefs_extra: Array.from(document.querySelectorAll('#acta1-listaLefsExtra .lef-extra-valor')).map(i => i.value.trim()).filter(Boolean),
            areas: Array.from(document.querySelectorAll('#acta1-listaAreasLabor .area-block')).map(block => ({
                area: block.querySelector('.area-labor-nombre').value.trim(),
                evidencias: Array.from(block.querySelectorAll('.lista-evidencias-labor textarea')).map(t => t.value.trim()).filter(Boolean)
            })).filter(a => a.area || a.evidencias.length),
            especialidades: leerEspecialidades(1),
            custodia: leerCadenaCustodia(1),
            custodiaAfis: leerCadenaCustodiaAfis(1),
            horaInicio: leerHoraInicioActa(1),
            dossier: datosDossierDeActa(1)
        };

        const lista = [acta1];
        document.querySelectorAll('#contenedor-actas-nuevas .bloque-acta').forEach(b => {
            const idActa = parseInt(b.id.replace('acta-bloque-', ''), 10);
            lista.push({
                lef: b.querySelector('.acta-lef').value.trim() || "---",
                fechaRaw: b.querySelector('.acta-fecha').value,
                fecha: formatearFechaSalida(b.querySelector('.acta-fecha').value),
                h_sol: formatearHoraVal(b.querySelector('.acta-hsol').value),
                h_sal: formatearHoraVal(b.querySelector('.acta-hsal').value),
                h_fin: formatearHoraVal(b.querySelector('.acta-hfin').value, true),
                lugar: aFormatoTitulo(b.querySelector('.acta-lugar').value),
                gps: b.querySelector('.acta-gps').value.trim() || "---",
                lefs_extra: leerLefsExtra(b),
                areas: leerAreasLabor(b),
                especialidades: leerEspecialidades(idActa),
                custodia: leerCadenaCustodia(idActa),
                custodiaAfis: leerCadenaCustodiaAfis(idActa),
                horaInicio: leerHoraInicioActa(idActa),
                dossier: datosDossierDeActa(idActa),
                accidentologia: leerAccidentologiaDeBloque(b)
            });
        });
        return lista;
    }

    function construirEstructuraCampos() {
        let rawCaratula = document.getElementById('caratula').value.trim();
        const car = rawCaratula ? `"${rawCaratula.toUpperCase()}"` : "---";
        const dco = document.getElementById('dco').value || "---";
        const vic = aFormatoTitulo(document.getElementById('victima').value);
        let rawImputado = document.getElementById('imputado').value.trim();
        const imp = rawImputado ? aFormatoTitulo(rawImputado) : "---";
        const seccional = document.getElementById('jpc').value !== "---" ? `${document.getElementById('jpc').value} – ${document.getElementById('dep').value}` : "---";
        const ufi = document.getElementById('ufi').value || "---";
        const sin = document.getElementById('sintesis').value;
        const sinBR = sin.replace(/\n/g, "<br>");

        const actas = recolectarDatosActas();
        const esMultiple = actas.length > 1;

        const formatearCampo = (key, esHTML = false) => {
            if (!esMultiple) return actas[0][key];
            const salto = esHTML ? "<br>" : "\n";
            return salto + actas.map((a, i) => `${i + 1}. ${a[key]}`).join(salto);
        };

        // LEF adicionales: solo se listan si hay al menos una carga
        const hayLefsExtra = actas.some(a => a.lefs_extra.length > 0);
        const formatearLefsExtra = (esHTML = false) => {
            if (!esMultiple) return actas[0].lefs_extra.join(", ");
            const salto = esHTML ? "<br>" : "\n";
            return salto + actas.map((a, i) => a.lefs_extra.length ? `${i + 1}. ${a.lefs_extra.join(", ")}` : null).filter(Boolean).join(salto);
        };

        // Labor pericial (Accidentología + Áreas y evidencias) por acta: si hay más de una acta, se numera cada bloque
        const laborDeActaTexto = (a) => [formatearAccidentologiaTexto(a.accidentologia), formatearAreasTexto(a.areas)].filter(Boolean).join("\n");
        const laborDeActaHTML = (a) => [formatearAccidentologiaHTML(a.accidentologia), formatearAreasHTML(a.areas)].filter(Boolean).join("<br>");

        let laborWA = "", laborHTML = "";
        if (esMultiple) {
            laborWA = actas.map((a, index) => {
                const t = laborDeActaTexto(a);
                return t ? `*${index + 1}*\n${t}` : "";
            }).filter(Boolean).join("\n\n");

            laborHTML = actas.map((a, index) => {
                const t = laborDeActaHTML(a);
                return t ? `<b>${index + 1}</b><br>${t}` : "";
            }).filter(Boolean).join("<br><br>");
        } else {
            laborWA = laborDeActaTexto(actas[0]);
            laborHTML = laborDeActaHTML(actas[0]);
        }

        return {
            car, dco, vic, imp, seccional, ufi, sin, sinBR,
            laborWA, laborHTML, hayLefsExtra,
            actasRaw: actas,
            fecha: formatearCampo('fecha'),
            lef: formatearCampo('lef'),
            h_sol: formatearCampo('h_sol'),
            h_sal: formatearCampo('h_sal'),
            h_fin: formatearCampo('h_fin'),
            lugar: formatearCampo('lugar'),
            gps: formatearCampo('gps'),
            lefsExtra: formatearLefsExtra(false),
            fechaHTML: formatearCampo('fecha', true),
            lefHTML: formatearCampo('lef', true),
            h_solHTML: formatearCampo('h_sol', true),
            h_salHTML: formatearCampo('h_sal', true),
            h_finHTML: formatearCampo('h_fin', true),
            lugarHTML: formatearCampo('lugar', true),
            gpsHTML: formatearCampo('gps', true),
            lefsExtraHTML: formatearLefsExtra(true),
            tituloLabor: TITULO_LABOR
        };
    }

    // ============ SALIDAS: PDF / WORD (P.U.) / WHATSAPP ============

    // Nombre de archivo/documento a partir del LEF/A.R.A y la fecha de la 1ª acta,
    // para que el PDF y el P.U. queden guardados identificados por esos datos.
    function nombreArchivoBase(actasRaw) {
        const lef = (actasRaw[0]?.lef || "S-LEF").replace(/[^A-Za-z0-9_-]/g, '-');
        const fecha = (actasRaw[0]?.fechaRaw || "").replace(/[^A-Za-z0-9_-]/g, '-');
        return fecha ? `${lef}_${fecha}` : lef;
    }

    function generarPDF() {
        const d = construirEstructuraCampos();
        const tituloOriginal = document.title;
        document.title = `${nombreArchivoBase(d.actasRaw)}_extracto`;
        const htmlFinal = `
            <div class="campo-pdf"><b>C.C.R. CENTRO</b></div>
            <div class="campo-pdf"><b>D.D.P.C. LA PLATA - S.P.D BRANDSEN</b></div>
            <div class="campo-pdf"><b>CARÁTULA:</b> ${d.car}</div>
            <div class="campo-pdf"><b>FECHA:</b> ${d.fechaHTML}</div>
            <div class="campo-pdf"><b>DOC:</b> ${d.dco}</div>
            <div class="campo-pdf"><b>LEF/ARA:</b> ${d.lefHTML}</div>
            ${d.hayLefsExtra ? `<div class="campo-pdf"><b>LEF ADICIONAL:</b> ${d.lefsExtraHTML}</div>` : ''}
            <div class="campo-pdf"><b>HORA DE SOLICITUD:</b> ${d.h_solHTML}</div>
            <div class="campo-pdf"><b>HORA DE SALIDA:</b> ${d.h_salHTML}</div>
            <div class="campo-pdf"><b>HORA DE FINALIZACIÓN:</b> ${d.h_finHTML}</div>
            <div class="campo-pdf"><b>VÍCTIMA:</b> ${d.vic}</div>
            <div class="campo-pdf"><b>IMPUTADO:</b> ${d.imp}</div>
            <div class="campo-pdf"><b>SECCIONAL ACTUANTE:</b> ${d.seccional}</div>
            <div class="campo-pdf"><b>UFI INTERVINIENDO:</b> ${d.ufi}</div>
            <div class="campo-pdf"><b>LUGAR DEL HECHO:</b> ${d.lugarHTML}</div>
            <div class="campo-pdf"><b>GPS:</b> ${d.gpsHTML}</div>
            <div class="campo-pdf"><b>SÍNTESIS DEL HECHO:</b> ${d.sinBR}</div>
            <br>
            ${d.laborHTML ? `<div class="campo-pdf"><b>${d.tituloLabor}:</b><br>${d.laborHTML}</div>` : ''}
            <div class="firma-contenedor"><div class="firma-bloque">${FIRMA_DOCUMENTO_HTML}</div></div>`;
        document.getElementById('print-area').innerHTML = htmlFinal;

    }

    const TITULO_LABOR_PU = "LABOR DESARROLLADA";

    // Alfabeto español tradicional (28 letras, con LL después de L y Ñ después de N; sin CH)
    // para que la numeración de áreas nunca "salte" esas letras.
    const ALFABETO_AREAS = ['A','B','C','D','E','F','G','H','I','J','K','L','LL','M','N','Ñ','O','P','Q','R','S','T','U','V','W','X','Y','Z'];

    // A, B, C ... LL ... Ñ ... Z, AA, AB ... (letra de área, 0-based)
    function letraDeArea(i) {
        const base = ALFABETO_AREAS.length;
        let n = i + 1, letra = '';
        while (n > 0) {
            const resto = (n - 1) % base;
            letra = ALFABETO_AREAS[resto] + letra;
            n = Math.floor((n - 1) / base);
        }
        return letra;
    }

    // El usuario carga solo los códigos de evidencia separados por coma (ej: "B4, B5, B6, B7")
    // y acá se arma la frase fija con el mismo formato que sus P.U. reales: "Evidencias
    // entregadas a la instrucción con cadena de custodia. B4, B5, B6 Y B7.-"
    function formatearCadenaCustodia(texto) {
        if (!texto) return "";
        const codigos = texto.split(',').map(s => s.trim()).filter(Boolean);
        if (!codigos.length) return "";
        const lista = codigos.length === 1
            ? codigos[0]
            : codigos.slice(0, -1).join(', ') + ' Y ' + codigos[codigos.length - 1];
        return `Evidencias entregadas a la instrucción con cadena de custodia. ${lista}.-`;
    }
    // Evidencias remitidas a A.F.I.S. (huellas/rastros a valorizar) — misma idea que la cadena
    // de custodia a Instrucción, pero con su propia frase fija y sin la "Y" antes del último ítem.
    function formatearCadenaCustodiaAfis(texto) {
        if (!texto) return "";
        const codigos = texto.split(',').map(s => s.trim()).filter(Boolean);
        if (!codigos.length) return "";
        return `Evidencias remitidas a sección AFIS, para su valorización: ${codigos.join(', ')}.`;
    }

    // Para el P.U. (Word) la labor pericial se arma distinto que en WhatsApp/PDF:
    // - Título "LABOR DESARROLLADA" (no "LABOR PERICIAL Y EVIDENCIAS").
    // - Suma las "Especialidades" (Fotografía/Rastro-Química/etc., exclusivas del P.U.).
    // - Las áreas llevan letra automática (Área A, B, C...) que sigue corriendo de una acta
    //   a la otra, con cada evidencia numerada con esa misma letra (B1, B2...).
    // - La frase "De la inspección ocular..." aparece UNA sola vez, antes del primer bloque de áreas.
    // - De la 2ª acta en adelante, un encabezado "AMPLIACIÓN:" repite el LEF/ARA, LUGAR DEL HECHO
    //   y GPS de esa acta antes de sus áreas (suele ser un lugar distinto al de la 1ª acta).
    function construirLaborDesarrolladaHTML(actas) {
        let indiceArea = 0;
        const bloques = [];

        actas.forEach((acta, idxActa) => {
            const lineas = [];

            if (idxActa > 0) {
                lineas.push('<b>AMPLIACIÓN:</b>');
                lineas.push(`<b>LEF/ARA:</b> ${acta.lef}`);
                lineas.push(`<b>LUGAR DEL HECHO:</b> ${acta.lugar}`);
                lineas.push(`<b>GPS:</b> ${acta.gps}`);
            }

            const especialidadesTxt = formatearEspecialidadesHTML(acta.especialidades);
            if (especialidadesTxt) lineas.push(especialidadesTxt);

            const accTxt = formatearAccidentologiaHTML(acta.accidentologia);
            if (accTxt) lineas.push(accTxt);

            const areasValidas = (acta.areas || []).filter(a => a.area || (a.evidencias && a.evidencias.length));
            if (areasValidas.length) {
                // Va después de las especialidades/accidentología de ESTA acta, antes de sus
                // áreas — se repite en cada acta/ampliación, no una sola vez para todo el P.U.
                lineas.push('De la inspección ocular arrojo los siguientes resultados:');
                areasValidas.forEach(a => {
                    const letra = letraDeArea(indiceArea);
                    indiceArea++;
                    lineas.push(`<b>Área ${letra}:</b> ${a.area || ''}`);
                    // Si el usuario escribió varias evidencias en un mismo cuadro separadas
                    // con Enter, cada línea se numera como una evidencia individual (B1, B2...)
                    // en lugar de quedar todas pegadas bajo un solo número.
                    let numEvidencia = 0;
                    (a.evidencias || []).forEach(ev => {
                        String(ev).split(/\r?\n/).map(s => s.trim()).filter(Boolean).forEach(sub => {
                            numEvidencia++;
                            lineas.push(`<b>${letra}${numEvidencia}:</b> ${sub}`);
                        });
                    });
                });
            }

            // Cadena de custodia: va al final de las áreas de esta acta (no siempre se
            // secuestra/entrega todo, por eso es opcional y el usuario carga solo los códigos).
            const custodiaTxt = formatearCadenaCustodia(acta.custodia);
            if (custodiaTxt) lineas.push(custodiaTxt);
            const custodiaAfisTxt = formatearCadenaCustodiaAfis(acta.custodiaAfis);
            if (custodiaAfisTxt) lineas.push(custodiaAfisTxt);

            if (lineas.length) bloques.push(lineas.join('<br>'));
        });

        return bloques.join('<br><br>');
    }

    // Nombre del archivo del P.U., a pedido de Federico: "DCO <dco> <lef> <carátula> – <víctima> <fecha>"
    // (ej: "DCO 11571-26 4436-00223-26 Averiguación Causales de Muerte – Merlo, Jose 19-08-2026"),
    // con el año de DCO y LEF acortado a 2 dígitos. Distinto del nombre del PDF/"extracto" y del Dossier.
    function acortarAnioDCO(dco) {
        if (!dco || dco === '---') return dco || '---';
        const partes = dco.split('/');
        if (partes.length === 2) {
            const anio = /^\d{4}$/.test(partes[1]) ? partes[1].slice(-2) : partes[1];
            return `${partes[0]}-${anio}`;
        }
        return dco.replace(/\//g, '-');
    }
    function acortarAnioLEF(lef) {
        if (!lef || lef === '---') return lef || '---';
        const partes = lef.split('-');
        const ultimo = partes[partes.length - 1];
        if (/^\d{4}$/.test(ultimo)) partes[partes.length - 1] = ultimo.slice(-2);
        return partes.join('-');
    }
    // Como aFormatoTitulo(), pero deja en minúscula los conectores en medio del texto
    // ("de", "la", "y"...), para que el nombre de archivo quede "Causales de Muerte"
    // y no "Causales De Muerte".
    function aFormatoTituloConConectores(texto) {
        if (!texto) return "---";
        const conectores = ['de', 'del', 'la', 'las', 'el', 'los', 'y', 'en', 'a', 'con', 'por', 'para', 'un', 'una', 'o'];
        return texto.trim().toLowerCase().split(/\s+/).map((palabra, i) => {
            if (i > 0 && conectores.includes(palabra)) return palabra;
            return palabra.charAt(0).toUpperCase() + palabra.slice(1);
        }).join(' ');
    }
    // Solo el apellido de la primera víctima (no el dato completo con edad/DNI/domicilio,
    // ni el resto de víctimas si el campo lista varias con "1- ... 2- ..."), para que el
    // nombre de archivo no quede kilométrico.
    function apellidoVictimaParaArchivo() {
        let raw = (document.getElementById('victima').value || '').trim();
        if (!raw) return '---';
        raw = raw.split(/\s+\d+[-:.]\s+/)[0]; // se queda con la 1ª víctima si hay varias listadas
        raw = raw.replace(/^\d+[-:.]\s*/, '').trim(); // saca un "1- " que haya quedado al principio
        if (!raw) return '---';
        const antesDeComa = raw.split(',')[0].trim(); // formato "Apellido, Nombre..."
        const primeraPalabra = antesDeComa.split(/\s+/)[0]; // formato "Apellido Nombre (edad)..."
        return primeraPalabra || '---';
    }
    function nombreArchivoPU(d, acta1) {
        const dcoCorto = acortarAnioDCO(d.dco);
        const lefCorto = acortarAnioLEF(acta1.lef);
        const caratula = aFormatoTituloConConectores(document.getElementById('caratula').value);
        const apellido = apellidoVictimaParaArchivo();
        const fecha = formatearFechaSalida(acta1.fechaRaw).replace(/\//g, '-');
        const nombre = `DCO ${dcoCorto} ${lefCorto} ${caratula} – ${apellido} ${fecha}`;
        return nombre.replace(/[\\/:*?"<>|]/g, '-');
    }

    function exportarWord() {
        const d = construirEstructuraCampos();
        const actas = d.actasRaw;

        const laborPU_HTML = construirLaborDesarrolladaHTML(actas);

        const nombreArchivo = `${nombreArchivoPU(d, actas[0])}.doc`;

        const contenidoHTML = `<!DOCTYPE html>
        <html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40">
        <head>
            <meta charset="utf-8">
            <!--[if gte mso 9]>
            <xml>
                <w:WordDocument>
                    <w:View>Print</w:View>
                    <w:Zoom>100</w:Zoom>
                </w:WordDocument>

            </style>
        </head>
        <body>
            <p><b>C.C.R. CENTRO</b></p>
            <p><b>D.D.P.C. LA PLATA - S.P.D BRANDSEN</b></p>
            <p><b>CARÁTULA:</b> ${d.car}</p>

    // ============ DOSSIER (Word) ============
    // El Dossier es un documento distinto del P.U.: portada con datos generales del caso
    // (I.P.P., etc. — Instructora se toma directo de Seccional Actuante) + un bloque narrativo
    // "Diligencias periciales" por acta
    // (Labor desarrollada + Peritos intervinientes + Resultado) + las mismas Áreas/evidencias
    // que Labor Pericial, pero numeradas con guion ("C-1"), a diferencia del P.U. ("C1").
    // No lleva la frase "De la inspección ocular..." del P.U.

    function fechaLarga(fechaISO) {
        if (!fechaISO) return "---";
        const meses = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
        const partes = fechaISO.split('-').map(Number);
        const [y, m, dia] = partes;
        if (!y || !m || !dia) return "---";
        return `${dia} de ${meses[m - 1]} de ${y}`;
    }

    // Texto base fijo de "Labor Desarrollada", igual para todas las actas — solo cambian las
    // dos horas (inicio y fin de la labor pericial en el lugar).
    function construirLaborDesarrolladaDossier(horaInicio, horaFin) {
        const hi = (horaInicio || '').trim() || '---';
        const hf = (horaFin || '').trim() || '---';
        return `Constituida comisión pericial en el lugar del hecho, siendo las ${hi} horas, en presencia del testigo hábil, se procede a dar inicio a labor pericial consistente en inspección ocular, a los fines de detección de indicios y/o evidencias de interés pericial, mediante fijación fotográfica y codificación alfanumérica, lográndose individualizar y registrar las evidencias que a continuación se detallan, realizando planimetría a mano alzada del lugar para posterior plano a escala. Dándose por finalizada la labor a las ${hf} horas.`;
    }

    function construirDiligenciasDossierHTML(actas) {
        let indiceArea = 0;
        const bloques = [];

        actas.forEach((acta, idxActa) => {
            const lineas = [];

            if (idxActa === 0) {
                lineas.push('<b>DILIGENCIAS PERICIALES:</b>');
                lineas.push('');
                lineas.push(`<b>FECHA:</b> ${acta.fecha}`);
                lineas.push('');
                lineas.push(`<b>ACTA PRIMARIA L.E.F.:</b> ${acta.lef}`);
            } else {
                lineas.push(`<b>FECHA:</b> ${acta.fecha}`);
                lineas.push(`<b>AMPLIACION ACTA L.E.F.:</b> ${acta.lef}`);
                lineas.push(`<b>REFERENTE ACTA PRIMARIA L.E.F.:</b> ${actas[0].lef}`);
                lineas.push(`<b>UBICACIÓN GPS:</b> ${acta.gps}`);
            }

            const dossierActa = acta.dossier || {};

            // "Labor desarrollada" ya no se escribe a mano: es un texto base fijo, igual para
            // todas las actas, donde lo único que cambia son las dos horas (inicio/fin) — que
            // ya se cargan en otro lado (Hora de Inicio del Acta, dentro de Datos para P.U., y
            // Hora de Finalización, arriba en el form de esa acta).
            lineas.push('');
            lineas.push(`<b>LABOR DESARROLLADA:</b> ${construirLaborDesarrolladaDossier(acta.horaInicio, acta.h_fin)}`);

            if (dossierActa.peritos && dossierActa.peritos.length) {
                lineas.push('');
                lineas.push('<b>Peritos Intervinientes:</b>');
                dossierActa.peritos.forEach(p => lineas.push(`${p.especialidad}: ${p.nombre}`));
            }

            if (dossierActa.resultado) {
                lineas.push('');
                lineas.push(`<b>RESULTADO:</b> ${dossierActa.resultado}`);
            }

            const areasValidas = (acta.areas || []).filter(a => a.area || (a.evidencias && a.evidencias.length));
            if (areasValidas.length) {
                lineas.push('');
                areasValidas.forEach(a => {
                    const letra = letraDeArea(indiceArea);
                    indiceArea++;
                    lineas.push(`<b>ÁREA ${letra}:</b> ${a.area || ''}`);
                    let numEvidencia = 0;
                    (a.evidencias || []).forEach(ev => {
                        String(ev).split(/\r?\n/).map(s => s.trim()).filter(Boolean).forEach(sub => {
                            numEvidencia++;
                            lineas.push(`<b>${letra}-${numEvidencia}:</b> ${sub}`);
                        });
                    });
                });
            }

            const custodiaTxt = formatearCadenaCustodia(acta.custodia);
            if (custodiaTxt) {
                lineas.push('');
                lineas.push(custodiaTxt);
            }
            const custodiaAfisTxt = formatearCadenaCustodiaAfis(acta.custodiaAfis);
            if (custodiaAfisTxt) {
                lineas.push('');
                lineas.push(custodiaAfisTxt);
            }

            bloques.push(lineas.join('<br>'));
        });

        return bloques.join('<br><br>');
    }

    function guardarEnHistorial(data) {

        storage.unshift(data);

    function dibujarHist() {
        let s = JSON.parse(localStorage.getItem('hist_BRANDSEN_FINAL') || "[]");

        if(container) {

            listaActas = d.actas.map((acta, i) => {
